<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EasyLife - Daily Life Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --bg:#dff3ff;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
    --input:#f5f5f5;
    --border:#ddd;
    --button:#2563eb;
    --button-hover:#1d4ed8;
    --danger:#dc2626;
    --success:#16a34a;
    --shadow:0 5px 20px rgba(0,0,0,.10);
}

body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f5f5f5;
    --muted:#bbb;
    --input:#2a2a2a;
    --border:#444;
    --button:#3b82f6;
    --button-hover:#2563eb;
    --danger:#ef4444;
    --success:#22c55e;
    --shadow:0 5px 20px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 15px;
    background:var(--button);
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:var(--button-hover);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--input);
    color:var(--text);
    font-size:15px;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--button);
}

.container{
    max-width:900px;
    margin:auto;
}

header{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:var(--shadow);
}

header h1{
    margin:0;
}

header p{
    margin:5px 0;
    color:var(--muted);
}

.status{
    margin-top:8px;
    font-size:13px;
}

.status.loading{
    color:var(--muted);
}

.status.success{
    color:var(--success);
}

.status.error{
    color:var(--danger);
}

nav{
    background:var(--card);
    padding:10px;
    border-radius:14px;
    margin-bottom:15px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    box-shadow:var(--shadow);
}

nav button{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    white-space:nowrap;
}

nav button:hover{
    background:var(--input);
}

.card{
    background:var(--card);
    padding:20px;
    margin:15px 0;
    border-radius:16px;
    box-shadow:var(--shadow);
}

.card h2{
    margin-top:0;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
}

.stat h3{
    margin:5px 0;
}

.stat p{
    margin:10px 0 0;
    font-size:25px;
    font-weight:bold;
}

ul{
    padding:0;
    list-style:none;
}

.task-item{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin:10px 0;
    display:flex;
    align-items:center;
    gap:10px;
}

.task-check{
    width:20px;
    height:20px;
    margin:0;
}

.task-text{
    flex:1;
    word-break:break-word;
}

.task-completed{
    text-decoration:line-through;
    opacity:.55;
}

.delete{
    background:var(--danger);
    padding:8px 11px;
}

.delete:hover{
    background:var(--danger);
}

.item{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin:10px 0;
}

.item-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.note-content{
    margin-top:10px;
    white-space:pre-wrap;
    word-break:break-word;
}

.item-date{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
}

.expense-amount{
    font-size:18px;
    font-weight:bold;
}

.total{
    font-size:22px;
    font-weight:bold;
}

.message{
    min-height:20px;
    color:var(--muted);
    font-size:14px;
}

footer{
    text-align:center;
    padding:25px 10px;
    color:var(--muted);
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    header{
        align-items:flex-start;
    }

    header h1{
        font-size:24px;
    }

    .card{
        padding:16px;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>

<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/* =========================================================
   DOM
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const theme =
        localStorage.getItem("EasyLifeTheme");


    if(theme === "dark"){

        document.body.classList.add("dark");

        $("themeButton").textContent =
            "☀️ Light";

    }

}


function toggleTheme(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");


    localStorage.setItem(
        "EasyLifeTheme",
        dark ? "dark" : "light"
    );


    $("themeButton").textContent =
        dark ? "☀️ Light" : "🌙 Dark";

}


/* =========================================================
   DATE
========================================================= */

function loadDate(){

    $("today").textContent =
        "📅 " +
        new Date().toLocaleDateString(
            "en-IN",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type
){

    const status =
        $("connectionStatus");

    status.textContent =
        text;

    status.className =
        "status " + type;

}


/* =========================================================
   ANONYMOUS AUTH
========================================================= */

async function connect(){

    try{

        setStatus(
            "⏳ Checking your EasyLife account...",
            "loading"
        );


        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            throw error;

        }


        if(data.session){

            currentUser =
                data.session.user;

        }

        else{

            setStatus(
                "⏳ Creating your private EasyLife account...",
                "loading"
            );


            const result =
                await supabaseClient.auth.signInAnonymously();


            if(result.error){

                throw result.error;

            }


            currentUser =
                result.data.user;

        }


        if(!currentUser){

            throw new Error(
                "Supabase did not return a user."
            );

        }


        console.log(
            "EasyLife user:",
            currentUser.id
        );


        setStatus(
            "🟢 Cloud storage connected",
            "success"
        );


        await loadAll();


    }

    catch(error){

        console.error(
            "EasyLife connection error:",
            error
        );


        setStatus(
            "🔴 " + error.message,
            "error"
        );

    }

}


/* =========================================================
   LOAD ALL DATA
========================================================= */

async function loadAll(){

    await loadTasks();

    await loadNotes();

    await loadExpenses();

    updateDashboard();

}


/* =========================================================
   TASKS - LOAD
========================================================= */

async function loadTasks(){

    if(!currentUser) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("tasks")
        .select("*")
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        $("taskMessage").textContent =
            "❌ " + error.message;

        return;

    }


    const list =
        $("list");

    list.innerHTML = "";


    data.forEach(task => {

        const li =
            document.createElement("li");

        li.className =
            "task-item";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.className =
            "task-check";

        checkbox.checked =
            task.completed;


        const text =
            document.createElement("span");

        text.className =
            "task-text";

        text.textContent =
            task.task;


        if(task.completed){

            text.classList.add(
                "task-completed"
            );

        }


        checkbox.addEventListener(
            "change",
            () =>
                toggleTask(
                    task.id,
                    checkbox.checked
                )
        );


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.textContent =
            "🗑️";


        deleteButton.onclick =
            () =>
                deleteTask(
                    task.id
                );


        li.appendChild(checkbox);

        li.appendChild(text);

        li.appendChild(deleteButton);

        list.appendChild(li);

    });


    $("taskCount").textContent =
        data.length;

}


/* =========================================================
   TASKS - ADD
========================================================= */

async function addTask(){

    if(!currentUser){

        $("taskMessage").textContent =
            "⏳ Still connecting to cloud storage...";

        return;

    }


    const input =
        $("task");

    const task =
        input.value.trim();


    if(!task){

        $("taskMessage").textContent =
            "⚠️ Enter a task first.";

        return;

    }


    const button =
        $("addTaskButton");

    button.disabled = true;


    $("taskMessage").textContent =
        "⏳ Saving task...";


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .insert({
            user_id:currentUser.id,
            task:task,
            completed:false
        });


    button.disabled = false;


    if(error){

        console.error(error);

        $("taskMessage").textContent =
            "❌ " + error.message;

        return;

    }


    input.value = "";


    $("taskMessage").textContent =
        "✅ Task saved permanently.";


    await loadTasks();

    updateDashboard();

}


/* =========================================================
   TASKS - UPDATE
========================================================= */

async function toggleTask(
    id,
    completed
){

    if(!currentUser) return;


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .update({
            completed:completed
        })
        .eq("id",id)
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        alert(
            "Could not update task:\n" +
            error.message
        );

        await loadTasks();

        return;

    }


    await loadTasks();

}


/* =========================================================
   TASKS - DELETE
========================================================= */

async function deleteTask(id){

    if(!currentUser) return;


    if(!confirm(
        "Delete this task permanently?"
    )){

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .delete()
        .eq("id",id)
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        alert(
            "Could not delete task:\n" +
            error.message
        );

        return;

    }


    await loadTasks();

    updateDashboard();

}

/* =========================================================

========================================================= */

<!DOCTYPE html>
<html>
<head>
<title>EasyLife</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
}

button{
padding:8px;
cursor:pointer;
}

input, textarea{
padding:8px;
width:90%;
}

textarea{
height:100px;
}

li{
margin:8px 0;
}

.delete{
margin-left:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>🌟 EasyLife</h1>
<p>Your Daily Life Assistant</p>

<div class="card">

<h2>📝 To-Do List</h2>

<input id="task" placeholder="Enter task">

<button onclick="addTask()">Add</button>

<ul id="list"></ul>

</div>

<div class="card">

<h2>📒 Notes</h2>

<textarea id="note" placeholder="Write your note"></textarea>

<br><br>

<button onclick="saveNote()">Save Note</button>

<p id="savedNote"></p>

</div>

<div class="card">

<h2>💰 Expense Tracker</h2>

<p>Coming Soon...</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// TO-DO LIST

function addTask(){

let task =
document.getElementById("task").value.trim();

if(task === ""){
return;
}

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.push(task);

localStorage.setItem(
"EasyLifeTasks",
JSON.stringify(tasks)
);

document.getElementById("task").value = "";

showTasks();

}


function showTasks(){

let list =
document.getElementById("list");

list.innerHTML = "";

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.forEach(function(task,index){

let li =
document.createElement("li");

li.textContent = task;

let del =
document.createElement("button");

del.innerHTML = "❌";

del.className = "delete";

del.onclick = function(){

deleteTask(index);

};

li.appendChild(del);

list.appendChild(li);

});

}


function deleteTask(index){

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.splice(index,1);

localStorage.setItem(
"EasyLifeTasks",
JSON.stringify(tasks)
);

showTasks();

}


// SAVE NOTE

async function saveNote(){

let note =
document.getElementById("note").value.trim();

let message =
document.getElementById("savedNote");

if(note === ""){

message.innerHTML =
"⚠️ Please write a note first.";

return;

}

message.innerHTML = "⏳ Saving...";

const { error } =
await supabaseClient
.from("notes")
.insert({
content: note
});

if(error){

console.error(error);

message.innerHTML =
"❌ Error: " + error.message;

return;

}

message.innerHTML =
"✅ Note saved successfully!";

}


// LOAD NOTES

async function loadNotes(){

const { data, error } =
await supabaseClient
.from("notes")
.select("id, content, created_at")
.order("created_at", {
ascending:false
});

if(error){

console.error(error);

document.getElementById("savedNote").innerHTML =
"❌ Could not load notes: " +
error.message;

return;

}

if(data && data.length > 0){

document.getElementById("note").value =
data[0].content;

document.getElementById("savedNote").innerHTML =
"✅ Saved note loaded.";

}

}


// PAGE LOAD

window.addEventListener(
"load",
function(){

showTasks();

loadNotes();

});

</script>

</body>
</html>

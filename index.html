<!DOCTYPE html>
<html>

<head>

<title>EasyLife</title>

<style>

body{
font-family:Arial;
background:#dff3ff;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
}

button{
padding:8px;
cursor:pointer;
}

input, textarea, select{
padding:8px;
width:90%;
margin:5px 0;
}

textarea{
height:100px;
}

li{
margin:8px 0;
}

.delete{
margin-left:10px;
cursor:pointer;
}

.expense-item{
padding:10px;
margin:8px 0;
background:#f5f5f5;
border-radius:8px;
}

.total{
font-size:22px;
font-weight:bold;
}

</style>

</head>


<body>


<h1>🌟 EasyLife</h1>

<p>Your Daily Life Assistant</p>


<!-- ========================= -->
<!-- TO-DO LIST -->
<!-- ========================= -->

<div class="card">

<h2>📝 To-Do List</h2>

<input
id="task"
placeholder="Enter task"
>

<button onclick="addTask()">
Add
</button>

<ul id="list"></ul>

<p id="taskMessage"></p>

</div>


<!-- ========================= -->
<!-- NOTES -->
<!-- ========================= -->

<div class="card">

<h2>📒 Notes</h2>

<textarea
id="note"
placeholder="Write your note"
></textarea>

<br><br>

<button onclick="saveNote()">
Save Note
</button>

<p id="savedNote"></p>

</div>


<!-- ========================= -->
<!-- EXPENSE TRACKER -->
<!-- ========================= -->

<div class="card">

<h2>💰 Expense Tracker</h2>

<input
id="expenseAmount"
type="number"
placeholder="Enter amount"
>

<select id="expenseCategory">

<option value="Food">🍔 Food</option>

<option value="Travel">🚗 Travel</option>

<option value="Shopping">🛍️ Shopping</option>

<option value="Bills">💡 Bills</option>

<option value="Education">📚 Education</option>

<option value="Other">📦 Other</option>

</select>

<input
id="expenseDescription"
placeholder="Description"
>

<button onclick="addExpense()">
Add Expense
</button>

<p id="expenseMessage"></p>

<p class="total">
Total: ₹<span id="totalExpense">0</span>
</p>

<h3>📋 Expense History</h3>

<div id="expenseList"></div>

</div>


<!-- ========================= -->
<!-- SUPABASE -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// =========================
// ADD TASK
// =========================

async function addTask(){

const task =
document.getElementById("task")
.value
.trim();

const message =
document.getElementById("taskMessage");

if(task === ""){

message.innerHTML =
"⚠️ Please enter a task.";

return;

}

message.innerHTML =
"⏳ Saving task...";

const { error } =
await supabaseClient
.from("tasks")
.insert({
content:task
});

if(error){

console.error(error);

message.innerHTML =
"❌ Error: " +
error.message;

return;

}

document.getElementById("task").value="";

message.innerHTML =
"✅ Task saved!";

loadTasks();

}


// =========================
// LOAD TASKS
// =========================

async function loadTasks(){

const { data,error } =
await supabaseClient
.from("tasks")
.select("content,created_at")
.order("created_at",{
ascending:false
});

if(error){

console.error(error);

return;

}

const list =
document.getElementById("list");

list.innerHTML="";

data.forEach(function(task){

const li =
document.createElement("li");

li.textContent =
task.content;

const del =
document.createElement("button");

del.innerHTML="❌";

del.className="delete";

del.onclick=function(){

deleteTask(
task.content,
task.created_at
);

};

li.appendChild(del);

list.appendChild(li);

});

}


// =========================
// DELETE TASK
// =========================

async function deleteTask(
content,
createdAt
){

const { error } =
await supabaseClient
.from("tasks")
.delete()
.eq("content",content)
.eq("created_at",createdAt);

if(error){

console.error(error);

return;

}

loadTasks();

}


// =========================
// SAVE NOTE
// =========================

async function saveNote(){

const note =
document.getElementById("note")
.value
.trim();

const message =
document.getElementById("savedNote");

if(note===""){

message.innerHTML =
"⚠️ Please write a note first.";

return;

}

message.innerHTML =
"⏳ Saving note...";

const { error } =
await supabaseClient
.from("notes")
.insert({
content:note
});

if(error){

console.error(error);

message.innerHTML =
"❌ Error: " +
error.message;

return;

}

message.innerHTML =
"✅ Note saved successfully!";

}


// =========================
// LOAD NOTE
// =========================

async function loadNotes(){

const { data,error } =
await supabaseClient
.from("notes")
.select("content,created_at")
.order("created_at",{
ascending:false
})
.limit(1);

if(error){

console.error(error);

return;

}

if(data && data.length>0){

document.getElementById("note").value =
data[0].content;

document.getElementById("savedNote").innerHTML =
"✅ Saved note loaded.";

}

}


// =========================
// ADD EXPENSE
// =========================

async function addExpense(){

const amount =
document.getElementById("expenseAmount")
.value;

const category =
document.getElementById("expenseCategory")
.value;

const description =
document.getElementById("expenseDescription")
.value
.trim();

const message =
document.getElementById("expenseMessage");


if(amount==="" || Number(amount)<=0){

message.innerHTML =
"⚠️ Enter a valid amount.";

return;

}

message.innerHTML =
"⏳ Saving expense...";


const { error } =
await supabaseClient
.from("expenses")
.insert({

amount:Number(amount),

category:category,

description:description

});


if(error){

console.error(error);

message.innerHTML =
"❌ Error: " +
error.message;

return;

}


document.getElementById("expenseAmount").value="";

document.getElementById("expenseDescription").value="";

message.innerHTML =
"✅ Expense saved!";

loadExpenses();

}


// =========================
// LOAD EXPENSES
// =========================

async function loadExpenses(){

const { data,error } =
await supabaseClient
.from("expenses")
.select(
"amount,category,description,expense_date,created_at"
)
.order("created_at",{
ascending:false
});

if(error){

console.error(error);

document.getElementById("expenseMessage").innerHTML =
"❌ Could not load expenses: " +
error.message;

return;

}


const list =
document.getElementById("expenseList");

list.innerHTML="";


let total=0;


data.forEach(function(expense){

total += Number(expense.amount);


const div =
document.createElement("div");

div.className =
"expense-item";


div.innerHTML =

"<strong>₹" +
expense.amount +
"</strong> - " +
expense.category +
"<br>" +
(expense.description || "No description") +
"<br>" +
"<small>" +
expense.expense_date +
"</small>";


const del =
document.createElement("button");

del.innerHTML =
"❌ Delete";

del.className =
"delete";


del.onclick=function(){

deleteExpense(
expense.amount,
expense.created_at
);

};


div.appendChild(del);

list.appendChild(div);

});


document.getElementById("totalExpense").innerText =
total.toFixed(2);

}


// =========================
// DELETE EXPENSE
// =========================

async function deleteExpense(
amount,
createdAt
){

const { error } =
await supabaseClient
.from("expenses")
.delete()
.eq("amount",amount)
.eq("created_at",createdAt);

if(error){

console.error(error);

return;

}

loadExpenses();

}


// =========================
// WEBSITE LOAD
// =========================

window.addEventListener(
"load",
function(){

loadTasks();

loadNotes();

loadExpenses();

});

</script>


</body>

</html>

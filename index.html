<!DOCTYPE html>
<html>
<head>
<title>EasyLife</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
}

button{
padding:8px;
cursor:pointer;
}

input, textarea{
padding:8px;
width:90%;
}

textarea{
height:100px;
}

li{
margin:8px 0;
}

.delete{
margin-left:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🌟 EasyLife</h1>
<p>Your Daily Life Assistant</p>


<div class="card">

<h2>📝 To-Do List</h2>

<input id="task" placeholder="Enter task">

<button onclick="addTask()">Add</button>

<ul id="list"></ul>

</div>



<div class="card">

<h2>📒 Notes</h2>

<textarea id="note" placeholder="Write your note"></textarea>

<br><br>

<button onclick="saveNote()">Save Note</button>

<p id="savedNote"></p>

</div>



<div class="card">

<h2>💰 Expense Tracker</h2>

<p>Coming Soon...</p>

</div>



<script>


// Add task permanently

function addTask(){

let task=document.getElementById("task").value;

if(task==""){
return;
}

let tasks=JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.push(task);

localStorage.setItem("EasyLifeTasks", JSON.stringify(tasks));

document.getElementById("task").value="";

showTasks();

}


// Display saved tasks

function showTasks(){

let list=document.getElementById("list");

list.innerHTML="";

let tasks=JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.forEach(function(task,index){

let li=document.createElement("li");

li.innerHTML=task;

let del=document.createElement("button");

del.innerHTML="❌";

del.className="delete";

del.onclick=function(){

deleteTask(index);

};

li.appendChild(del);

list.appendChild(li);

});

}


// Delete task

function deleteTask(index){

let tasks=JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.splice(index,1);

localStorage.setItem("EasyLifeTasks", JSON.stringify(tasks));

showTasks();

}



// Save note permanently

function saveNote(){

let note=document.getElementById("note").value;

localStorage.setItem("EasyLifeNote", note);

document.getElementById("savedNote").innerHTML="Saved: "+note;

}



// Load everything when website opens

window.onload=function(){

let savedNote=localStorage.getItem("EasyLifeNote");

if(savedNote){

document.getElementById("note").value=savedNote;

document.getElementById("savedNote").innerHTML="Saved: "+savedNote;

}

showTasks();

};


</script>


</body>
</html>

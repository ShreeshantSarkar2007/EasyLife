<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyLife - Daily Life Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --bg:#dff3ff;
    --card:#ffffff;
    --text:#222222;
    --muted:#666666;
    --input:#f5f5f5;
    --border:#dddddd;
    --button:#2563eb;
    --button-hover:#1d4ed8;
    --button-text:#ffffff;
    --danger:#dc2626;
    --success:#16a34a;
    --shadow:0 5px 20px rgba(0,0,0,0.10);
}

body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f5f5f5;
    --muted:#bbbbbb;
    --input:#2a2a2a;
    --border:#444444;
    --button:#3b82f6;
    --button-hover:#2563eb;
    --button-text:#ffffff;
    --danger:#ef4444;
    --success:#22c55e;
    --shadow:0 5px 20px rgba(0,0,0,0.35);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

button{
    border:none;
    border-radius:10px;
    padding:11px 15px;
    background:var(--button);
    color:var(--button-text);
    cursor:pointer;
    font-size:14px;
    transition:0.2s;
}

button:hover{
    background:var(--button-hover);
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--input);
    color:var(--text);
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--button);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.message{
    min-height:20px;
    color:var(--muted);
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
}

/* HEADER */

header{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:var(--shadow);
}

header h1{
    margin:0;
}

header p{
    margin:5px 0;
    color:var(--muted);
}

.status{
    font-size:13px;
    color:var(--success);
    margin-top:8px;
}

/* NAVIGATION */

nav{
    background:var(--card);
    padding:10px;
    border-radius:14px;
    margin-bottom:15px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    box-shadow:var(--shadow);
}

nav button{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    white-space:nowrap;
}

nav button:hover{
    background:var(--input);
}

/* CARDS */

.card{
    background:var(--card);
    padding:20px;
    margin:15px 0;
    border-radius:16px;
    box-shadow:var(--shadow);
}

.card h2{
    margin-top:0;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
}

.stat h3{
    margin:5px 0;
}

.stat p{
    margin:10px 0 0;
    font-size:25px;
    font-weight:bold;
}

/* TASKS */

ul{
    padding-left:0;
    list-style:none;
}

.task-item{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin:10px 0;
    display:flex;
    align-items:center;
    gap:10px;
}

.task-text{
    flex:1;
    word-break:break-word;
}

.task-completed{
    text-decoration:line-through;
    opacity:0.6;
}

.task-check{
    width:20px;
    height:20px;
    margin:0;
    cursor:pointer;
}

.delete{
    background:var(--danger);
    padding:8px 11px;
}

.delete:hover{
    background:var(--danger);
}

/* NOTES / EXPENSES */

.item{
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin:10px 0;
    line-height:1.5;
}

.note-content{
    white-space:pre-wrap;
    word-break:break-word;
}

.item-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.item-date{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
}

.total{
    font-size:22px;
    font-weight:bold;
}

.expense-amount{
    font-size:18px;
    font-weight:bold;
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px 10px;
    color:var(--muted);
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    header{
        align-items:flex-start;
    }

    header h1{
        font-size:24px;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:16px;
    }

    .task-item{
        align-items:flex-start;
    }

    .delete{
        flex-shrink:0;
    }
}

</style>
</head>


<body>

<div id="app" class="container">

    <!-- HEADER -->

    <header>

        <div>

            <h1>🌟 EasyLife</h1>

            <p>Your Daily Life Assistant</p>

            <div id="connectionStatus" class="status">
                ⏳ Connecting...
            </div>

        </div>

        <button id="themeButton" type="button">
            🌙 Dark
        </button>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <button data-section="dashboard" type="button">
            📊 Dashboard
        </button>

        <button data-section="tasks" type="button">
            📝 Tasks
        </button>

        <button data-section="notes" type="button">
            📒 Notes
        </button>

        <button data-section="expenses" type="button">
            💰 Expenses
        </button>

    </nav>


    <!-- DASHBOARD -->

    <div class="card" id="dashboard">

        <h2>📊 Dashboard</h2>

        <p id="today" class="message"></p>

        <div class="dashboard">

            <div class="stat">

                <h3>📝 Tasks</h3>

                <p id="taskCount">0</p>

            </div>

            <div class="stat">

                <h3>📒 Notes</h3>

                <p id="noteCount">0</p>

            </div>

            <div class="stat">

                <h3>💰 Expenses</h3>

                <p id="expenseCount">0</p>

            </div>

            <div class="stat">

                <h3>💵 Total Spent</h3>

                <p>
                    ₹<span id="dashboardTotal">0.00</span>
                </p>

            </div>

        </div>

    </div>


    <!-- TASKS -->

    <div class="card" id="tasks">

        <h2>📝 To-Do List</h2>

            id="task"
            type="text"
            placeholder="Enter a task"
            maxlength="500"
        >

        </button>

        <ul id="list"></ul>

    </div>


    <!-- NOTES -->

    <div class="card" id="notes">

        <h2>📒 Notes</h2>

        <textarea
            id="note"
            placeholder="Write your note..."
            maxlength="10000"
        ></textarea>

        <button id="saveNoteButton" type="button">
            💾 Save Note
        </button>

        <p id="savedNote" class="message"></p>

        <div id="notesList"></div>

    </div>


    <!-- EXPENSES -->

    <div class="card" id="expenses">

        <h2>💰 Expense Tracker</h2>

        <input

            type="number"
            min="0"
            step="0.01"
            placeholder="Enter amount"
        >

        <select id="expenseCategory">

            <option value="Food">🍔 Food</option>
            <option value="Travel">🚗 Travel</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">💡 Bills</option>
            <option value="Education">📚 Education</option>
            <option value="Other">📦 Other</option>

        </select>

        <input
            id="expenseDescription"
            type="text"
            placeholder="Description"
            maxlength="500"
        >

        <button id="addExpenseButton" type="button">
            ➕ Add Expense
        </button>

        <p id="expenseMessage" class="message"></p>

        <p class="total">
            Total: ₹<span id="totalExpense">0.00</span>
        </p>

        <h3>📋 Expense History</h3>

        <div id="expenseList"></div>

    </div>


    <footer>
        🌟 EasyLife — Your Daily Life Assistant
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/* =========================================================
   SHORT DOM FUNCTION
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value){

    const div = document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const theme =
        localStorage.getItem("EasyLifeTheme");

    if(theme === "dark"){

        document.body.classList.add("dark");

        $("themeButton").textContent =
            "☀️ Light";

    }else{

        document.body.classList.remove("dark");

        $("themeButton").textContent =
            "🌙 Dark";
    }
}


function toggleTheme(){

    document.body.classList.toggle("dark");

    const isDark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "EasyLifeTheme",
        isDark ? "dark" : "light"
    );

    $("themeButton").textContent =
        isDark ? "☀️ Light" : "🌙 Dark";
}


/* =========================================================
   DATE
========================================================= */

function loadDate(){

    const today = new Date();

    $("today").textContent =
        "📅 " +
        today.toLocaleDateString(
            "en-IN",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date){

    if(!date) return "";

    return new Date(date).toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   AUTHENTICATION
   NO LOGIN INTERFACE
========================================================= */

async function initializeAnonymousUser(){

    $("connectionStatus").textContent =
        "⏳ Connecting to EasyLife...";

    try{

        /*
         * First check whether this browser already
         * has an anonymous Supabase session.
         */

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient.auth.getSession();


        if(sessionError){

            throw sessionError;
        }


        if(sessionData.session){

            currentUser =
                sessionData.session.user;

        }else{

            /*
             * No session exists.
             * Create an anonymous Supabase account.
             */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInAnonymously();


            if(error){

                throw error;
            }


            if(!data.user){

                throw new Error(
                    "Anonymous user could not be created."
                );
            }


            currentUser = data.user;
        }


        $("connectionStatus").textContent =
            "🟢 Cloud storage connected";

        await loadAllData();

    }catch(error){

        console.error(error);

        $("connectionStatus").textContent =
            "🔴 Connection error";

        alert(
            "EasyLife could not connect to Supabase.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadAllData(){

    await Promise.all([
        loadTasks(),
        loadNotes(),
        loadExpenses()
    ]);

    updateDashboard();
}


/* =========================================================
   TASKS
========================================================= */

async function loadTasks(){

    if(!currentUser) return;

    const {
        data,
        error
    } =
    await supabaseClient
        .from("tasks")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {ascending:false});


    if(error){

        console.error(error);

        $("taskMessage").textContent =
            "❌ Could not load tasks.";

        return;
    }


    const list = $("list");

    list.innerHTML = "";


    data.forEach(task => {

        const li =
            document.createElement("li");

        li.className = "task-item";


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className = "task-check";

        checkbox.checked =
            task.completed;


        checkbox.addEventListener(
            "change",
            () => toggleTask(
                task.id,
                checkbox.checked
            )
        );


        const text =
            document.createElement("span");

        text.className = "task-text";

        if(task.completed){

            text.classList.add(
                "task-completed"
            );
        }

        text.textContent =
            task.task;


        const deleteButton =
            document.createElement("button");

        deleteButton.className = "delete";

        deleteButton.textContent = "🗑️";

        deleteButton.title =
            "Delete task";


        deleteButton.addEventListener(
            "click",
            () => deleteTask(task.id)
        );


        li.appendChild(checkbox);

        li.appendChild(text);

        li.appendChild(deleteButton);

        list.appendChild(li);

    });


    $("taskCount").textContent =
        data.length;
}


/* =========================================================
   ADD TASK
========================================================= */

async function addTask(){

    const input = $("task");

    const taskText =
        input.value.trim();


    if(!taskText){

        $("taskMessage").textContent =
            "⚠️ Please enter a task.";

        return;
    }


    if(!currentUser){

        $("taskMessage").textContent =
            "⏳ Connecting...";

        return;
    }


    const button =
        $("addTaskButton");

    button.disabled = true;

    $("taskMessage").textContent =
        "⏳ Saving task...";


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .insert({
            user_id:currentUser.id,
            task:taskText,
            completed:false
        });


    button.disabled = false;


    if(error){

        console.error(error);

        $("taskMessage").textContent =
            "❌ " + error.message;

        return;
    }


    input.value = "";

    $("taskMessage").textContent =
        "✅ Task saved permanently.";

    await loadTasks();

    updateDashboard();
}


/* =========================================================
   COMPLETE / UNCOMPLETE TASK
========================================================= */

async function toggleTask(
    id,
    completed
){

    if(!currentUser) return;


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .update({
            completed:completed
        })
        .eq("id",id)
        .eq("user_id",currentUser.id);


    if(error){

        console.error(error);

        alert(
            "Could not update task:\n" +
            error.message
        );

        await loadTasks();

        return;
    }


    await loadTasks();

    updateDashboard();
}


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTask(id){

    if(!currentUser) return;


    const confirmed =
        confirm(
            "Delete this task permanently?"
        );


    if(!confirmed) return;


    const {
        error
    } =
    await supabaseClient
        .from("tasks")
        .delete()
        .eq("id",id)
        .eq("user_id",currentUser.id);


    if(error){

        console.error(error);

        alert(
            "Could not delete task:\n" +
            error.message
        );

        return;
    }


    await loadTasks();

    updateDashboard();
}


/* =========================================================
   NOTES
========================================================= */

async function loadNotes(){

    if(!currentUser) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("notes")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        $("savedNote").textContent =
            "❌ Could not load notes.";

        return;
    }


    const container =
        $("notesList");

    container.innerHTML = "";


    data.forEach(note => {

        const item =
            document.createElement("div");

        item.className = "item";


        const header =
            document.createElement("div");

        header.className =
            "item-header";


        const title =
            document.createElement("strong");

        title.textContent =
            "📒 Note";


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.textContent =
            "🗑️ Delete";


        deleteButton.addEventListener(
            "click",
            () => deleteNote(note.id)
        );


        header.appendChild(title);

        header.appendChild(deleteButton);


        const content =
            document.createElement("div");

        content.className =
            "note-content";

        content.textContent =
            note.content;


        const date =
            document.createElement("div");

        date.className =
            "item-date";

        date.textContent =
            "Saved: " +
            formatDate(note.created_at);


        item.appendChild(header);

        item.appendChild(content);

        item.appendChild(date);

        container.appendChild(item);

    });


    $("noteCount").textContent =
        data.length;
}


/* =========================================================
   SAVE NOTE
========================================================= */

async function saveNote(){

    const textarea =
        $("note");

    const content =
        textarea.value.trim();


    if(!content){

        $("savedNote").textContent =
            "⚠️ Please write something first.";

        return;
    }


    if(!currentUser){

        $("savedNote").textContent =
            "⏳ Connecting...";

        return;
    }


    const button

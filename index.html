<!DOCTYPE html>
<html>

<head>

<title>EasyLife</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
}

button{
padding:8px;
cursor:pointer;
}

input, textarea{
padding:8px;
width:90%;
}

textarea{
height:100px;
}

li{
margin:8px 0;
}

.delete{
margin-left:10px;
cursor:pointer;
}

</style>

</head>


<body>


<h1>🌟 EasyLife</h1>

<p>Your Daily Life Assistant</p>


<!-- TO-DO LIST -->

<div class="card">

<h2>📝 To-Do List</h2>

<input
id="task"
placeholder="Enter task"
>

<button onclick="addTask()">
Add
</button>

<ul id="list"></ul>

<p id="taskMessage"></p>

</div>


<!-- NOTES -->

<div class="card">

<h2>📒 Notes</h2>

<textarea
id="note"
placeholder="Write your note"
></textarea>

<br><br>

<button onclick="saveNote()">
Save Note
</button>

<p id="savedNote"></p>

</div>


<!-- EXPENSE TRACKER -->

<div class="card">

<h2>💰 Expense Tracker</h2>

<p>Coming Soon...</p>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// =========================
// ADD TASK
// =========================

async function addTask(){

const task =
document.getElementById("task")
.value
.trim();

const message =
document.getElementById("taskMessage");


if(task === ""){

message.innerHTML =
"⚠️ Please enter a task.";

return;

}


message.innerHTML =
"⏳ Saving task...";


const { error } =
await supabaseClient
.from("tasks")
.insert({
content: task
});


if(error){

console.error(error);

message.innerHTML =
"❌ Error: " +
error.message;

return;

}


document.getElementById("task").value = "";

message.innerHTML =
"✅ Task saved!";

loadTasks();

}


// =========================
// LOAD TASKS
// =========================

async function loadTasks(){

const { data, error } =
await supabaseClient
.from("tasks")
.select("content, created_at")
.order("created_at", {
ascending:false
});


if(error){

console.error(error);

document.getElementById("taskMessage").innerHTML =
"❌ Could not load tasks: " +
error.message;

return;

}


const list =
document.getElementById("list");

list.innerHTML = "";


if(!data){

return;

}


data.forEach(function(task){

const li =
document.createElement("li");

li.textContent =
task.content;


const del =
document.createElement("button");

del.innerHTML =
"❌";

del.className =
"delete";


del.onclick =
function(){

deleteTask(
task.content,
task.created_at
);

};


li.appendChild(del);

list.appendChild(li);

});

}


// =========================
// DELETE TASK
// =========================

async function deleteTask(
content,
createdAt
){

const { error } =
await supabaseClient
.from("tasks")
.delete()
.eq("content", content)
.eq("created_at", createdAt);


if(error){

console.error(error);

document.getElementById("taskMessage").innerHTML =
"❌ Could not delete task: " +
error.message;

return;

}


document.getElementById("taskMessage").innerHTML =
"✅ Task deleted.";

loadTasks();

}


// =========================
// SAVE NOTE
// =========================

async function saveNote(){

const note =
document.getElementById("note")
.value
.trim();

const message =
document.getElementById("savedNote");


if(note === ""){

message.innerHTML =
"⚠️ Please write a note first.";

return;

}


message.innerHTML =
"⏳ Saving note...";


const { error } =
await supabaseClient
.from("notes")
.insert({
content: note
});


if(error){

console.error(error);

message.innerHTML =
"❌ Error: " +
error.message;

return;

}


message.innerHTML =
"✅ Note saved successfully!";


// Keep the saved note visible
document.getElementById("note").value =
note;

}


// =========================
// LOAD LATEST NOTE
// =========================

async function loadNotes(){

const { data, error } =
await supabaseClient
.from("notes")
.select("content, created_at")
.order("created_at", {
ascending:false
})
.limit(1);


if(error){

console.error(error);

document.getElementById("savedNote").innerHTML =
"❌ Could not load notes: " +
error.message;

return;

}


if(data && data.length > 0){

document.getElementById("note").value =
data[0].content;

document.getElementById("savedNote").innerHTML =
"✅ Saved note loaded.";

}

}


// =========================
// WHEN WEBSITE OPENS
// =========================

window.addEventListener(
"load",
function(){

loadTasks();

loadNotes();

});

</script>


</body>

</html>

<!DOCTYPE html>
<html>
<head>
<title>EasyLife</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
}

button{
padding:8px;
cursor:pointer;
}

input, textarea{
padding:8px;
width:90%;
}

textarea{
height:100px;
}

li{
margin:8px 0;
}

.delete{
margin-left:10px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>🌟 EasyLife</h1>
<p>Your Daily Life Assistant</p>

<div class="card">

<h2>📝 To-Do List</h2>

<input id="task" placeholder="Enter task">

<button onclick="addTask()">Add</button>

<ul id="list"></ul>

</div>

<div class="card">

<h2>📒 Notes</h2>

<textarea id="note" placeholder="Write your note"></textarea>

<br><br>

<button onclick="saveNote()">Save Note</button>

<p id="savedNote"></p>

</div>

<div class="card">

<h2>💰 Expense Tracker</h2>

<p>Coming Soon...</p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lhxjfyzqpsmqejxfrxlg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4o82RmTdkM9f5j5negCsKg_wmZYZGtW";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// =========================
// TO-DO LIST
// =========================

function addTask(){

let task =
document.getElementById("task").value;

if(task==""){
return;
}

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.push(task);

localStorage.setItem(
"EasyLifeTasks",
JSON.stringify(tasks)
);

document.getElementById("task").value="";

showTasks();

}


function showTasks(){

let list =
document.getElementById("list");

list.innerHTML="";

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.forEach(function(task,index){

let li =
document.createElement("li");

li.innerHTML=task;

let del =
document.createElement("button");

del.innerHTML="❌";

del.className="delete";

del.onclick=function(){

deleteTask(index);

};

li.appendChild(del);

list.appendChild(li);

});

}


function deleteTask(index){

let tasks =
JSON.parse(localStorage.getItem("EasyLifeTasks")) || [];

tasks.splice(index,1);

localStorage.setItem(
"EasyLifeTasks",
JSON.stringify(tasks)
);

showTasks();

}


// =========================
// NOTES
// =========================

async function saveNote(){

let note =
document.getElementById("note").value.trim();

if(note==""){
return;
}

const { data, error } = await supabase
.from("notes")
.insert([
{
content:note
}
]);

if(error){

console.error(error);

document.getElementById("savedNote").innerHTML =
"❌ Error saving note";

return;

}

document.getElementById("savedNote").innerHTML =
"✅ Note saved successfully!";

}


async function loadNote(){

const { data, error } = await supabase
.from("notes")
.select("*")
.order("created_at",{ascending:false})
.limit(1);

if(error){

console.error(error);

return;

}

if(data && data.length>0){

document.getElementById("note").value =
data[0].content;

document.getElementById("savedNote").innerHTML =
"Last saved note loaded.";

}

}


// =========================
// PAGE LOAD
// =========================

window.onload=function(){

showTasks();

loadNote();

};

</script>

</body>
</html>
